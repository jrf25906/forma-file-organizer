<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forma – 3D Hero Section</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0A0A0B;
    color: #F0F0F2;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }

  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .hero-text {
    text-align: center;
    margin-bottom: 40px;
  }

  .hero-text h1 {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeInUp 1s ease-out 0.3s forwards;
  }

  .hero-text h1 em {
    font-style: italic;
    color: #6B9BC2;
  }

  .hero-text p {
    font-size: clamp(16px, 2vw, 20px);
    font-weight: 300;
    color: rgba(240, 240, 242, 0.6);
    max-width: 480px;
    margin: 0 auto;
    line-height: 1.6;
    opacity: 0;
    animation: fadeInUp 1s ease-out 0.6s forwards;
  }

  .stats-row {
    display: flex;
    gap: 48px;
    opacity: 0;
    animation: fadeInUp 1s ease-out 0.9s forwards;
  }

  .stat {
    text-align: center;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 400;
    margin-bottom: 4px;
  }

  .stat-value.blue { color: #6B8CA8; }
  .stat-value.orange { color: #C97E66; }
  .stat-value.green { color: #8BA688; }

  .stat-label {
    font-size: 12px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(240, 240, 242, 0.4);
  }

  /* Floating category labels */
  .category-label {
    position: fixed;
    z-index: 15;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    backdrop-filter: blur(12px);
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .category-label.visible { opacity: 1; }

  .category-label .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }

  .cat-documents {
    background: rgba(107, 140, 168, 0.12);
    border: 1px solid rgba(107, 140, 168, 0.2);
    color: #6B8CA8;
  }
  .cat-documents .dot { background: #6B8CA8; }

  .cat-media {
    background: rgba(201, 126, 102, 0.12);
    border: 1px solid rgba(201, 126, 102, 0.2);
    color: #C97E66;
  }
  .cat-media .dot { background: #C97E66; }

  .cat-downloads {
    background: rgba(139, 166, 136, 0.12);
    border: 1px solid rgba(139, 166, 136, 0.2);
    color: #8BA688;
  }
  .cat-downloads .dot { background: #8BA688; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(10, 10, 11, 0.7) 100%);
  }
</style>
</head>
<body>

<div id="canvas-container"></div>
<div class="vignette"></div>

<div class="overlay">
  <div class="hero-text">
    <h1>Your files,<br><em>finally organized</em></h1>
    <p>Forma watches how you work and learns where your files belong. Intelligent sorting that feels like magic.</p>
  </div>
  <div class="stats-row">
    <div class="stat">
      <div class="stat-value blue" id="stat-files">0</div>
      <div class="stat-label">Files sorted</div>
    </div>
    <div class="stat">
      <div class="stat-value orange" id="stat-time">0s</div>
      <div class="stat-label">Time saved</div>
    </div>
    <div class="stat">
      <div class="stat-value green" id="stat-accuracy">0%</div>
      <div class="stat-label">Accuracy</div>
    </div>
  </div>
</div>

<!-- Category labels positioned by JS -->
<div class="category-label cat-documents" id="label-docs">
  <span class="dot"></span> Documents
</div>
<div class="category-label cat-media" id="label-media">
  <span class="dot"></span> Media
</div>
<div class="category-label cat-downloads" id="label-downloads">
  <span class="dot"></span> Downloads
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Config ───
const COLORS = {
  bg: 0x0A0A0B,
  documents: new THREE.Color(0x6B8CA8),
  media: new THREE.Color(0xC97E66),
  downloads: new THREE.Color(0x8BA688),
  steelBlue: new THREE.Color(0x5B7C99),
  grid: new THREE.Color(0x1A1A1A),
  subtle: new THREE.Color(0x222225),
};

const CATEGORY_TARGETS = [
  { name: 'documents', color: COLORS.documents, angle: -Math.PI * 0.65, radius: 3.8, y: 0.6 },
  { name: 'media',     color: COLORS.media,     angle: Math.PI * 0.1,   radius: 4.0, y: -0.3 },
  { name: 'downloads', color: COLORS.downloads,  angle: Math.PI * 0.75,  radius: 3.5, y: -0.8 },
];

// ─── Scene Setup ───
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(COLORS.bg);
scene.fog = new THREE.FogExp2(COLORS.bg, 0.06);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// ─── Lights ───
const ambientLight = new THREE.AmbientLight(0x222233, 0.5);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0x6B8CA8, 2, 20);
pointLight1.position.set(-5, 3, 5);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0xC97E66, 1.5, 20);
pointLight2.position.set(5, -2, 3);
scene.add(pointLight2);

const pointLight3 = new THREE.PointLight(0x8BA688, 1, 15);
pointLight3.position.set(0, 4, -3);
scene.add(pointLight3);

// ─── Central Grid (Forma logo reference) ───
const gridGroup = new THREE.Group();
const gridSize = 0.18;
const gridGap = 0.06;
const gridOffset = -(gridSize + gridGap);

for (let row = 0; row < 3; row++) {
  for (let col = 0; col < 3; col++) {
    const opacity = row === 0 ? 0.9 : row === 1 ? 0.55 : 0.25;
    const geo = new THREE.BoxGeometry(gridSize, gridSize, gridSize * 0.3);
    const mat = new THREE.MeshStandardMaterial({
      color: 0xF0F0F2,
      transparent: true,
      opacity: opacity,
      roughness: 0.3,
      metalness: 0.1,
      emissive: 0x5B7C99,
      emissiveIntensity: opacity * 0.15,
    });
    const cube = new THREE.Mesh(geo, mat);
    cube.position.set(
      gridOffset + col * (gridSize + gridGap),
      -gridOffset - row * (gridSize + gridGap),
      0
    );
    // Round corners approximation via scale
    cube.castShadow = true;
    gridGroup.add(cube);
  }
}
gridGroup.position.set(0, 0, 0);
scene.add(gridGroup);

// Central glow sphere
const glowGeo = new THREE.SphereGeometry(0.6, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0x5B7C99,
  transparent: true,
  opacity: 0.04,
});
const glowSphere = new THREE.Mesh(glowGeo, glowMat);
scene.add(glowSphere);

// Outer glow
const outerGlowGeo = new THREE.SphereGeometry(1.2, 32, 32);
const outerGlowMat = new THREE.MeshBasicMaterial({
  color: 0x5B7C99,
  transparent: true,
  opacity: 0.015,
});
scene.add(new THREE.Mesh(outerGlowGeo, outerGlowMat));

// ─── File Particles ───
const FILE_COUNT = 180;
const TRAIL_LENGTH = 8;

// Each file: starts at a random "chaos" position, flows toward a category target
class FileParticle {
  constructor(index) {
    this.index = index;
    this.category = CATEGORY_TARGETS[index % 3];

    // Start position: scattered chaos
    this.startPos = new THREE.Vector3(
      (Math.random() - 0.5) * 16,
      (Math.random() - 0.5) * 10,
      (Math.random() - 0.5) * 8 - 2
    );

    // Target position: clustered around category
    const cat = this.category;
    const spread = 0.8;
    this.targetPos = new THREE.Vector3(
      Math.cos(cat.angle) * cat.radius + (Math.random() - 0.5) * spread,
      cat.y + (Math.random() - 0.5) * spread,
      Math.sin(cat.angle) * (cat.radius * 0.3) + (Math.random() - 0.5) * spread * 0.5
    );

    // Timing
    this.delay = Math.random() * 4 + index * 0.01;
    this.speed = 0.3 + Math.random() * 0.4;
    this.progress = 0;

    // Orbital drift after arrival
    this.orbitPhase = Math.random() * Math.PI * 2;
    this.orbitSpeed = 0.2 + Math.random() * 0.3;
    this.orbitRadius = 0.05 + Math.random() * 0.15;

    // Bezier control point for curved paths
    this.controlPoint = new THREE.Vector3(
      (this.startPos.x + this.targetPos.x) * 0.5 + (Math.random() - 0.5) * 4,
      (this.startPos.y + this.targetPos.y) * 0.5 + (Math.random() - 0.5) * 3 + 2,
      (this.startPos.z + this.targetPos.z) * 0.5 + (Math.random() - 0.5) * 2
    );

    this.currentPos = this.startPos.clone();
    this.trail = [];
    this.arrived = false;
    this.size = 0.03 + Math.random() * 0.04;
  }

  update(time) {
    const t = Math.max(0, time - this.delay);
    if (t <= 0) {
      this.currentPos.copy(this.startPos);
      return;
    }

    this.progress = Math.min(1, t * this.speed * 0.15);
    const ease = this.easeInOutCubic(this.progress);

    if (this.progress < 1) {
      // Quadratic bezier
      const inv = 1 - ease;
      this.currentPos.x = inv * inv * this.startPos.x + 2 * inv * ease * this.controlPoint.x + ease * ease * this.targetPos.x;
      this.currentPos.y = inv * inv * this.startPos.y + 2 * inv * ease * this.controlPoint.y + ease * ease * this.targetPos.y;
      this.currentPos.z = inv * inv * this.startPos.z + 2 * inv * ease * this.controlPoint.z + ease * ease * this.targetPos.z;
      this.arrived = false;
    } else {
      // Gentle orbit at target
      const orbT = time * this.orbitSpeed + this.orbitPhase;
      this.currentPos.x = this.targetPos.x + Math.cos(orbT) * this.orbitRadius;
      this.currentPos.y = this.targetPos.y + Math.sin(orbT * 0.7) * this.orbitRadius * 0.5;
      this.currentPos.z = this.targetPos.z + Math.sin(orbT) * this.orbitRadius * 0.3;
      this.arrived = true;
    }

    // Trail
    this.trail.push(this.currentPos.clone());
    if (this.trail.length > TRAIL_LENGTH) this.trail.shift();
  }

  easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }
}

const files = [];
for (let i = 0; i < FILE_COUNT; i++) {
  files.push(new FileParticle(i));
}

// Particle geometry (instanced via BufferGeometry points)
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(FILE_COUNT * 3);
const colors = new Float32Array(FILE_COUNT * 3);
const sizes = new Float32Array(FILE_COUNT);
const alphas = new Float32Array(FILE_COUNT);

particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
particleGeo.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));

const particleMat = new THREE.ShaderMaterial({
  uniforms: {
    uPixelRatio: { value: renderer.getPixelRatio() },
  },
  vertexShader: `
    attribute float size;
    attribute float alpha;
    attribute vec3 color;
    varying vec3 vColor;
    varying float vAlpha;
    uniform float uPixelRatio;
    void main() {
      vColor = color;
      vAlpha = alpha;
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * uPixelRatio * (200.0 / -mvPosition.z);
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float glow = exp(-d * d * 3.0);
      float core = smoothstep(0.5, 0.0, d);
      vec3 col = vColor * (glow * 0.6 + core * 1.2);
      float a = (glow * 0.4 + core * 0.8) * vAlpha;
      gl_FragColor = vec4(col, a);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

const particleSystem = new THREE.Points(particleGeo, particleMat);
scene.add(particleSystem);

// ─── Trail Lines ───
const trailGroups = [];
for (let i = 0; i < FILE_COUNT; i++) {
  const maxPts = TRAIL_LENGTH;
  const trailGeo = new THREE.BufferGeometry();
  const trailPos = new Float32Array(maxPts * 3);
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
  trailGeo.setDrawRange(0, 0);

  const file = files[i];
  const trailMat = new THREE.LineBasicMaterial({
    color: file.category.color,
    transparent: true,
    opacity: 0.08,
    blending: THREE.AdditiveBlending,
  });

  const line = new THREE.Line(trailGeo, trailMat);
  scene.add(line);
  trailGroups.push({ geo: trailGeo, line });
}

// ─── Orbital Rings (subtle) ───
function createRing(radius, color, y, tilt) {
  const ringGeo = new THREE.RingGeometry(radius - 0.005, radius + 0.005, 128);
  const ringMat = new THREE.MeshBasicMaterial({
    color: color,
    transparent: true,
    opacity: 0.06,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2 + tilt;
  ring.position.y = y;
  return ring;
}

scene.add(createRing(2.5, 0x5B7C99, 0, 0.3));
scene.add(createRing(3.8, 0x6B8CA8, 0.2, -0.15));
scene.add(createRing(5.0, 0x8BA688, -0.1, 0.5));

// ─── Background Stars ───
const starCount = 400;
const starGeo = new THREE.BufferGeometry();
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPositions[i * 3] = (Math.random() - 0.5) * 40;
  starPositions[i * 3 + 1] = (Math.random() - 0.5) * 30;
  starPositions[i * 3 + 2] = -10 - Math.random() * 20;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMat = new THREE.PointsMaterial({
  color: 0x444455,
  size: 0.015,
  transparent: true,
  opacity: 0.6,
});
scene.add(new THREE.Points(starGeo, starMat));

// ─── Connection Lines (between nearby arrived particles) ───
const maxConnections = 200;
const connectionGeo = new THREE.BufferGeometry();
const connPositions = new Float32Array(maxConnections * 6);
const connColors = new Float32Array(maxConnections * 6);
connectionGeo.setAttribute('position', new THREE.BufferAttribute(connPositions, 3));
connectionGeo.setAttribute('color', new THREE.BufferAttribute(connColors, 3));
const connectionMat = new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.12,
  blending: THREE.AdditiveBlending,
});
const connectionLines = new THREE.LineSegments(connectionGeo, connectionMat);
scene.add(connectionLines);

// ─── Stat Animation ───
function animateStats(time) {
  const progress = Math.min(1, time / 8);
  const ease = 1 - Math.pow(1 - progress, 3);

  const filesVal = Math.floor(ease * 12847);
  const timeVal = Math.floor(ease * 47);
  const accVal = (ease * 98.7).toFixed(1);

  document.getElementById('stat-files').textContent = filesVal.toLocaleString();
  document.getElementById('stat-time').textContent = timeVal + 'h';
  document.getElementById('stat-accuracy').textContent = accVal + '%';
}

// ─── Category Label Positioning ───
const labelElements = {
  documents: document.getElementById('label-docs'),
  media: document.getElementById('label-media'),
  downloads: document.getElementById('label-downloads'),
};

function updateLabels(time) {
  CATEGORY_TARGETS.forEach(cat => {
    const el = labelElements[cat.name];
    const pos3D = new THREE.Vector3(
      Math.cos(cat.angle) * cat.radius,
      cat.y + 1.2,
      Math.sin(cat.angle) * cat.radius * 0.3
    );
    pos3D.project(camera);

    const x = (pos3D.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-pos3D.y * 0.5 + 0.5) * window.innerHeight;

    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = 'translate(-50%, -50%)';

    // Show after files start arriving
    const arrivedCount = files.filter(f => f.category.name === cat.name && f.arrived).length;
    el.classList.toggle('visible', arrivedCount > 10);
  });
}

// ─── Animation Loop ───
const clock = new THREE.Clock();
let mouseX = 0, mouseY = 0;

document.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

function animate() {
  requestAnimationFrame(animate);

  const time = clock.getElapsedTime();
  const dt = clock.getDelta();

  // Camera sway
  camera.position.x += (mouseX * 1.2 - camera.position.x) * 0.02;
  camera.position.y += (1.5 - mouseY * 0.6 - camera.position.y) * 0.02;
  camera.lookAt(0, 0, 0);

  // Grid rotation
  gridGroup.rotation.y = Math.sin(time * 0.3) * 0.15;
  gridGroup.rotation.x = Math.sin(time * 0.2) * 0.08;

  // Glow pulse
  glowSphere.scale.setScalar(1 + Math.sin(time * 1.5) * 0.08);
  glowMat.opacity = 0.035 + Math.sin(time * 1.5) * 0.015;

  // Update particles
  let connIdx = 0;
  const arrivedByCategory = { documents: [], media: [], downloads: [] };

  for (let i = 0; i < FILE_COUNT; i++) {
    const file = files[i];
    file.update(time);

    positions[i * 3] = file.currentPos.x;
    positions[i * 3 + 1] = file.currentPos.y;
    positions[i * 3 + 2] = file.currentPos.z;

    const c = file.category.color;
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;

    sizes[i] = file.size * (file.arrived ? 1.0 : 0.7 + file.progress * 0.3);
    alphas[i] = file.progress < 0.01 ? 0 : (file.arrived ? 0.8 : 0.3 + file.progress * 0.5);

    // Update trail
    const trail = trailGroups[i];
    const trailPts = file.trail;
    const trailAttr = trail.geo.attributes.position;
    for (let j = 0; j < trailPts.length; j++) {
      trailAttr.array[j * 3] = trailPts[j].x;
      trailAttr.array[j * 3 + 1] = trailPts[j].y;
      trailAttr.array[j * 3 + 2] = trailPts[j].z;
    }
    trailAttr.needsUpdate = true;
    trail.geo.setDrawRange(0, trailPts.length);
    trail.line.material.opacity = file.arrived ? 0.02 : 0.06 * file.progress;

    if (file.arrived) {
      arrivedByCategory[file.category.name].push(file.currentPos);
    }
  }

  particleGeo.attributes.position.needsUpdate = true;
  particleGeo.attributes.color.needsUpdate = true;
  particleGeo.attributes.size.needsUpdate = true;
  particleGeo.attributes.alpha.needsUpdate = true;

  // Connection lines between nearby arrived particles (same category)
  connIdx = 0;
  for (const catName of Object.keys(arrivedByCategory)) {
    const pts = arrivedByCategory[catName];
    const catColor = CATEGORY_TARGETS.find(c => c.name === catName).color;

    for (let i = 0; i < pts.length && connIdx < maxConnections; i++) {
      for (let j = i + 1; j < pts.length && connIdx < maxConnections; j++) {
        const dist = pts[i].distanceTo(pts[j]);
        if (dist < 0.9 && dist > 0.15) {
          const base = connIdx * 6;
          connPositions[base] = pts[i].x;
          connPositions[base + 1] = pts[i].y;
          connPositions[base + 2] = pts[i].z;
          connPositions[base + 3] = pts[j].x;
          connPositions[base + 4] = pts[j].y;
          connPositions[base + 5] = pts[j].z;

          const fade = 1 - dist / 0.9;
          connColors[base] = catColor.r * fade;
          connColors[base + 1] = catColor.g * fade;
          connColors[base + 2] = catColor.b * fade;
          connColors[base + 3] = catColor.r * fade;
          connColors[base + 4] = catColor.g * fade;
          connColors[base + 5] = catColor.b * fade;
          connIdx++;
        }
      }
    }
  }
  connectionGeo.setDrawRange(0, connIdx * 2);
  connectionGeo.attributes.position.needsUpdate = true;
  connectionGeo.attributes.color.needsUpdate = true;

  // Light animation
  pointLight1.position.x = -5 + Math.sin(time * 0.5) * 2;
  pointLight2.position.y = -2 + Math.cos(time * 0.4) * 1.5;

  animateStats(time);
  updateLabels(time);

  renderer.render(scene, camera);
}

// ─── Resize ───
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  particleMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
});

animate();
</script>
</body>
</html>
